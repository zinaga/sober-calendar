<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sober Calendar</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#233047;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.app{max-width:1080px;margin:auto;padding:24px 14px 80px}header,.nav,.stats,.actions,.line,.sessionhead{display:flex;align-items:center;justify-content:space-between;gap:12px}header{margin-bottom:20px}h1{font-size:26px;margin:0}h2{font-size:20px;margin:0}p{color:#68758a}.panel{background:white;border:1px solid #e4e9f1;border-radius:18px;padding:18px;box-shadow:0 3px 16px #23304709}.stats{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:18px}.chartbox{padding:13px 16px}.chartrow{display:grid;grid-template-columns:105px minmax(0,1fr) 145px;align-items:center;gap:14px}.chartrow strong{font-size:15px}.chartrow small{color:#64748b;text-align:right;font-size:12px}.stack{min-width:0}.segment{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden}.segment.light{color:#38455b}.legend-shared{display:flex;flex-wrap:wrap;gap:8px 15px;padding:0 8px}.legend-shared .legenditem{font-size:12px}.charttitle{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:9px}.charttitle strong{font-size:16px}.charttitle small{color:#64748b}.stack{display:flex;height:30px;overflow:hidden;border-radius:9px;background:#eef1f6}.segment{height:100%;min-width:0;position:relative}.segment:not(:last-child){box-shadow:inset -1px 0 #ffffff88}.legend{display:flex;flex-wrap:wrap;gap:8px 15px;margin-top:12px}.legenditem{font-size:12px;color:#4c596d;display:flex;align-items:center;gap:5px}.dot{width:10px;height:10px;border-radius:3px;display:inline-block}.chartnote{font-size:12px;color:#64748b;margin-top:9px}.chartcounts{font-size:13px;color:#44546a;margin-top:8px}.stat{padding:16px}.stat b{font-size:26px;display:block}.stat small{color:#69788e}.nav{margin-bottom:15px}button,select,input{font:inherit;color:#233047;color-scheme:light}select option{color:#233047;background:#fff}select{appearance:auto;-webkit-appearance:menulist}button{cursor:pointer;border:1px solid #d9e1ed;border-radius:10px;padding:9px 12px;background:white;color:#24334b}button.primary{background:#3864df;color:white;border-color:#3864df}button.danger{color:#b42335}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a4baff}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekday{text-align:center;color:#7c8799;font-size:13px;padding:8px}.day{border:1px solid #e2e8f1;background:white;border-radius:12px;min-height:110px;text-align:left;padding:9px;overflow:hidden}.day{position:relative}.day-main{display:block;width:100%;height:100%;border:0;background:transparent;text-align:left;padding:0;color:inherit;cursor:pointer}.dry-toggle{position:absolute;right:6px;top:6px;width:23px;height:23px;min-width:23px;border:1.5px solid #aebdd1;border-radius:6px;background:#fff;padding:0;display:flex;align-items:center;justify-content:center;font-size:15px;color:#23764a;z-index:2}.dry-toggle.checked{background:#dcf6e5;border-color:#43a66b}.dry-toggle:focus-visible{outline:3px solid #a4baff}.day.empty{background:transparent;border:0}.day.today{border:2px solid #3864df}.day.selected{background:#eff4ff}.day.dry-day{background:#d9f3e1;border-color:#7fc99b}.day.dry-day .number{color:#17633b}.day.dry-day.selected{box-shadow:inset 0 0 0 2px #3864df}.day.dry-day .pill.dry{background:#bce9cc;color:#17633b;font-weight:700}.day .number{font-weight:700;display:block;margin-bottom:6px}.pill{display:block;background:#edf2f9;padding:5px;border-radius:7px;font-size:11px;margin:4px 0;overflow:hidden;text-overflow:ellipsis}.pill.solo{background:#fff0dd}.pill.after{background:#ffe0e0;color:#a11f2b}.pill .drinkdetail{display:block;font-size:10px;margin-top:3px;line-height:1.35;white-space:normal;overflow-wrap:anywhere}.pill.dry{background:#e3f7e9;color:#236b42}.pill.unknown{color:#8792a5;background:transparent}.editor{margin-top:18px}.session{border:1px solid #e1e7ef;border-radius:14px;padding:14px;margin:12px 0}.session.solo{border-left:4px solid #efa84c}.sessionhead{margin-bottom:10px}.drinkrow{display:grid;grid-template-columns:1.2fr 1.4fr .65fr auto;gap:7px;margin:8px 0}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}label{font-size:13px;font-weight:600}input,select{min-width:0;border:1px solid #d7dfeb;border-radius:9px;padding:10px;background:white;width:100%}.choice{display:flex;gap:8px;flex-wrap:wrap}.choice button.active{background:#e9efff;border-color:#5076e8}.muted{font-size:12px;color:#728096}.actions{justify-content:flex-start;flex-wrap:wrap;margin-top:15px}.empty-note{padding:22px;text-align:center;color:#8490a2}.foot{margin-top:18px;font-size:12px;color:#6b788b}.tag{background:#f0f3fa;border-radius:99px;padding:5px 10px;font-size:12px}.summary{margin-top:10px;color:#64748b;font-size:13px}@media(max-width:650px){.chartrow{grid-template-columns:75px minmax(0,1fr) 86px;gap:6px}.chartrow strong{font-size:12px}.chartrow small{font-size:9px}.stack{height:25px}.segment{font-size:9px}.legend-shared{gap:6px 10px}.app{padding:16px 8px 65px}h1{font-size:22px}.stats{grid-template-columns:1fr;gap:10px}.chartbox{padding:12px}.legend{gap:6px 10px}.stat{padding:12px}.stat b{font-size:23px}.panel{padding:12px}.calendar{gap:3px}.day{min-height:70px;padding:5px;border-radius:7px}.day .number{font-size:12px}.dry-toggle{right:3px;top:3px;width:19px;height:19px;min-width:19px;font-size:12px}.pill{font-size:9px;padding:3px;margin:2px 0}.weekday{font-size:11px}.drinkrow{grid-template-columns:1fr 1fr 65px auto}.drinkrow select,.drinkrow input{font-size:12px;padding:7px}.session{padding:10px}}
.day.multi-selected{outline:3px solid #3864df;outline-offset:-3px;background:#e6efff}.bulkbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;font-size:12px;color:#64748b}.bulkbar button{padding:6px 9px;font-size:12px}.bulkbar button[hidden]{display:none}

</style></head><body><main class="app"><header><div><h1>🍃 Sober Calendar</h1><p style="margin:5px 0">나의 음주 습관 기록</p></div><span class="tag">개인용 · V2.0</span></header><section class="stats" id="stats"></section><section class="panel"><div class="nav"><button id="prev" aria-label="이전 달">‹</button><h2 id="month"></h2><div><button id="today">오늘</button> <button id="next" aria-label="다음 달">›</button></div></div><div class="bulkbar"><span id="bulkHint">Ctrl/⌘ + 클릭: 개별 선택 · Shift + 클릭: 범위 선택</span><button id="bulkDry" type="button" hidden>선택한 날짜 금주 처리</button><button id="bulkClear" type="button" hidden>선택 해제</button></div><div class="calendar" id="calendar"></div></section><section class="panel editor" id="editor"></section><section class="panel" style="margin-top:18px"><h2>데이터 관리</h2><p class="muted">클라우드를 연결하면 컴퓨터와 휴대폰에서 같은 기록을 볼 수 있어요. 연결 전에는 브라우저에 저장되며 JSON 백업을 권장해요.</p><div id="cloudPanel" class="cloudpanel"><h3>☁️ 클라우드 동기화</h3><p class="muted" id="cloudStatus">클라우드 설정이 아직 없어요. 브라우저에만 저장 중입니다.</p><div class="actions" id="authActions"><input type="email" id="email" placeholder="로그인 이메일" aria-label="로그인 이메일" style="max-width:260px"><button id="login">이메일 로그인 링크 보내기</button><button id="logout" hidden>로그아웃</button><button id="syncNow" hidden>지금 동기화</button></div></div><div class="actions"><button id="export">JSON 백업 다운로드</button><button id="importBtn">JSON 백업 불러오기</button><input type="file" id="import" accept="application/json,.json" hidden></div></section><div class="foot">술을 마시지 않은 날은 '금주'로 직접 표시하세요. 미기록일은 금주일에 포함하지 않습니다.</div></main><script>
const KEY='sober-calendar-v1';let data={};try{data=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch{};const now=new Date(),today=key(now);let year=now.getFullYear(),month=now.getMonth(),selected=today;const multiSelected=new Set();let selectionAnchor=null;
const types={beer:'🍺 맥주',wine:'🍷 와인',soju:'🍶 소주',spirits:'🥃 양주/증류주',other:'🍸 기타'};const units={beer:[['smallcan','작은 캔 (355mL)'],['largecan','큰 캔 (500mL)'],['bottle','병 (330mL)'],['glass','잔 (500mL)'],['ml','mL']],wine:[['glass','잔 (150mL)'],['half','반 병 (375mL)'],['bottle','병 (750mL)'],['ml','mL']],soju:[['shot','잔 (50mL)'],['bottle','병 (360mL)'],['ml','mL']],spirits:[['shot','샷 (45mL)'],['glass','잔 (90mL)'],['ml','mL']],other:[['glass','잔 (200mL)'],['bottle','병 (500mL)'],['ml','mL']]};
function key(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function save(){localStorage.setItem(KEY,JSON.stringify(data));scheduleCloudSave()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function getDay(k){return data[k]||{status:'unknown',sessions:[]}}function setDay(k,v){data[k]=v;save();render()}function fmtDrink(d){let u=units[d.type]?.find(x=>x[0]===d.unit);return `${types[d.type]||'기타'} ×${d.qty??1} ${u?.[1]||d.unit}`}function shortDrink(d){const labels={smallcan:'작캔',largecan:'큰캔',bottle:'병',glass:'잔',shot:'샷',half:'반병',ml:'mL'};let unit=labels[d.unit]||d.unit;return `${types[d.type]||'🍸 기타'} ${unit} ×${d.qty??1}`}
function updateBulk(){const n=multiSelected.size;document.getElementById('bulkHint').textContent=n?`${n}일 선택됨 · Ctrl + 클릭으로 추가/해제`:'Ctrl/⌘ + 클릭: 개별 선택 · Shift + 클릭: 범위 선택 (Mac: ⌘)';document.getElementById('bulkDry').hidden=!n;document.getElementById('bulkClear').hidden=!n}
document.getElementById('bulkClear').onclick=()=>{multiSelected.clear();selectionAnchor=null;render()};
document.getElementById('bulkDry').onclick=()=>{const keys=[...multiSelected],drinks=keys.filter(k=>getDay(k).status==='drink');if(drinks.length&&!confirm(`선택한 날짜 중 ${drinks.length}일에 음주 기록이 있어요. 해당 기록을 삭제하고 모두 금주로 변경할까요?`))return;for(const k of keys)data[k]={status:'dry',sessions:[]};save();multiSelected.clear();selectionAnchor=null;render()};
function render(){document.getElementById('month').textContent=`${year}년 ${month+1}월`;let first=new Date(year,month,1).getDay(),length=new Date(year,month+1,0).getDate(),html=['일','월','화','수','목','금','토'].map(x=>`<div class="weekday">${x}</div>`).join('');for(let i=0;i<first;i++)html+='<div class="day empty"></div>';for(let d=1;d<=length;d++){let k=key(new Date(year,month,d)),v=getDay(k);let pills=v.status==='dry'?'<span class="pill dry">✓ 금주</span>':v.status==='drink'?v.sessions.map(s=>`<span class="pill ${s.after?'after':s.company==='solo'?'solo':''}">${s.after?'🔴 추가 음주 · ':s.company==='solo'?'🏠 혼술 · ':'🍻 함께 · '}<span class="drinkdetail">${(s.drinks||[]).map(shortDrink).map(esc).join('<br>')||'술 미입력'}</span></span>`).join(''):'<span class="pill unknown">미기록</span>';html+=`<div class="day ${k===today?'today':''} ${k===selected?'selected':''} ${v.status==='dry'?'dry-day':''} ${multiSelected.has(k)?'multi-selected':''}"><button type="button" class="day-main" data-day="${k}"><span class="number">${d}</span>${pills}</button><button type="button" class="dry-toggle ${v.status==='dry'?'checked':''}" data-dry="${k}" aria-label="${d}일 금주 ${v.status==='dry'?'취소':'체크'}" title="${v.status==='dry'?'금주 취소':'금주로 표시'}" aria-pressed="${v.status==='dry'}">${v.status==='dry'?'✓':''}</button></div>`}document.getElementById('calendar').innerHTML=html;document.querySelectorAll('[data-day]').forEach(b=>b.onclick=e=>{const k=b.dataset.day;if(e.shiftKey){const anchor=selectionAnchor||selected||k;const start=new Date(anchor+'T12:00:00');const end=new Date(k+'T12:00:00');if(!(e.ctrlKey||e.metaKey))multiSelected.clear();const lo=start<end?start:end,hi=start<end?end:start;for(let t=new Date(lo);t<=hi;t.setDate(t.getDate()+1))multiSelected.add(key(t));}else if(e.ctrlKey||e.metaKey){if(multiSelected.has(k))multiSelected.delete(k);else multiSelected.add(k);selectionAnchor=k;}else{selected=k;selectionAnchor=k;}render()});document.querySelectorAll('[data-dry]').forEach(b=>b.onclick=()=>{const k=b.dataset.dry,v=getDay(k);if(v.status==='drink'&&!confirm('이 날짜의 음주 기록을 지우고 금주로 변경할까요?'))return;setDay(k,{status:v.status==='dry'?'unknown':'dry',sessions:[]})});updateBulk();renderStats();renderEditor()}
function renderStats(){
 const colors={after:'#d93036',solo:'#f3a642',with:'#5a82d8',mixed:'#a678d6',dry:'#52aa79',unknown:'#e2e7ef'};
 const names={after:'귀가 후 추가 음주',solo:'혼술만',with:'함께만',mixed:'혼술+함께',dry:'금주',unknown:'미기록'};
 const order=['solo','mixed','with','after','dry','unknown'];
 const todayDate=new Date(now.getFullYear(),now.getMonth(),now.getDate());
 function oneWindow(days,label){
  const counts={after:0,solo:0,with:0,mixed:0,dry:0,unknown:0};
  for(let i=days-1;i>=0;i--){const date=new Date(todayDate);date.setDate(date.getDate()-i);const v=getDay(key(date));
   if(v.status==='dry'){counts.dry++;continue}
   if(v.status!=='drink'||!(v.sessions||[]).length){counts.unknown++;continue}
   const sessions=v.sessions||[];
   if(sessions.some(x=>x.after)){counts.after++;continue}
   const solo=sessions.some(x=>x.company==='solo'),withOthers=sessions.some(x=>x.company!=='solo');
   counts[solo&&withOthers?'mixed':solo?'solo':'with']++;
  }
  const bar=order.filter(k=>counts[k]).map(k=>{let pct=counts[k]/days*100;return `<div class="segment ${k==='unknown'||k==='dry'?'light':''}" title="${names[k]} ${counts[k]}일" style="width:${pct}%;background:${colors[k]}">${pct>=8?counts[k]+'일':''}</div>`}).join('');
  return `<div class="panel chartbox"><div class="chartrow"><strong>${label}</strong><div class="stack" role="img" aria-label="${label}: ${order.map(k=>names[k]+' '+counts[k]+'일').join(', ')}">${bar}</div><small>${days}일 기준 · 오늘 포함</small></div></div>`;
 }
 const legend=order.map(k=>`<span class="legenditem"><i class="dot" style="background:${colors[k]}"></i>${names[k]}</span>`).join('');
 document.getElementById('stats').innerHTML=oneWindow(90,'최근 3개월')+oneWindow(30,'최근 1개월')+`<div class="legend-shared">${legend}</div>`;
}
function renderEditor(){
 const v=getDay(selected), sessions=v.status==='drink'?(v.sessions||[]):[];
 let h=`<div class="line"><h2>${selected} 기록</h2><span class="tag">${sessions.length?'음주':v.status==='dry'?'금주':'미기록'}</span></div><p class="muted">음주 세션을 추가하면 자동으로 음주일로 기록돼요. 금주 여부는 달력 오른쪽 위 체크박스로 표시하세요.</p>`;
 h+=sessions.map((s,i)=>`<div class="session ${s.company==='solo'?'solo':''}">
 <div class="sessionhead"><div class="session-title"><b>${i+1}차</b><select class="company-inline" aria-label="${i+1}차 음주 상황" data-s="${i}" data-field="company"><option value="solo" ${s.company==='solo'?'selected':''}>🏠 혼술</option><option value="with" ${s.company==='with'?'selected':''}>🍻 함께</option></select></div><button class="danger" data-delete-session="${i}">세션 삭제</button></div>
 <label class="after-inline"><input type="checkbox" data-s="${i}" data-field="after" ${s.after?'checked':''}> 귀가 후 추가 음주</label>
 <div class="drinks-title"><b>마신 술</b></div>
 ${(s.drinks||[]).map((d,j)=>`<div class="drinkrow"><select data-s="${i}" data-d="${j}" data-drink="type">${Object.entries(types).map(([id,t])=>`<option value="${id}" ${d.type===id?'selected':''}>${t}</option>`).join('')}</select><select data-s="${i}" data-d="${j}" data-drink="unit">${units[d.type].map(([id,t])=>`<option value="${id}" ${d.unit===id?'selected':''}>${t}</option>`).join('')}</select><input aria-label="수량" type="number" min="1" step="1" inputmode="numeric" data-s="${i}" data-d="${j}" data-drink="qty" value="${esc(d.qty)}"><button class="danger" aria-label="술 삭제" data-remove-drink="${i},${j}">×</button></div>`).join('')}
 <button data-add-drink="${i}">+ 술 추가</button>
 <div class="field"><label>장소/동석자 (선택)</label><input data-s="${i}" data-field="who" value="${esc(s.who)}" placeholder="예: 친구들과 바에서, 집에서"></div>
 <div class="field"><label>세션 메모 (선택)</label><input data-s="${i}" data-field="note" value="${esc(s.note)}" placeholder="예: 아쉬워서 더 마심"></div></div>`).join('');
 h+='<button class="primary" id="addSession">+ 음주 세션 추가</button>';
 document.getElementById('editor').innerHTML=h;
 document.querySelectorAll('[data-delete-session]').forEach(b=>b.onclick=()=>{let a=structuredClone(getDay(selected));a.sessions.splice(+b.dataset.deleteSession,1);setDay(selected,a.sessions.length?{status:'drink',sessions:a.sessions}:{status:'unknown',sessions:[]})});
 document.getElementById('addSession').onclick=()=>{let a=structuredClone(getDay(selected));if(a.status==='dry'&&!confirm('금주 체크를 해제하고 음주 세션을 추가할까요?'))return;let ss=a.status==='drink'?(a.sessions||[]):[];ss.push(newSession());setDay(selected,{status:'drink',sessions:ss})};
 document.querySelectorAll('[data-add-drink]').forEach(b=>b.onclick=()=>{let a=structuredClone(getDay(selected));a.sessions[+b.dataset.addDrink].drinks.push({type:'beer',unit:'smallcan',qty:1});setDay(selected,a)});
 document.querySelectorAll('[data-remove-drink]').forEach(b=>b.onclick=()=>{let [i,j]=b.dataset.removeDrink.split(',').map(Number),a=structuredClone(getDay(selected));a.sessions[i].drinks.splice(j,1);setDay(selected,a)});
 document.querySelectorAll('[data-field],[data-drink]').forEach(el=>el.onchange=()=>{let a=structuredClone(getDay(selected)),i=+el.dataset.s;if(el.dataset.field){a.sessions[i][el.dataset.field]=el.dataset.field==='after'?el.checked:el.value}else{let d=a.sessions[i].drinks[+el.dataset.d],f=el.dataset.drink;d[f]=f==='qty'?Math.max(1,Math.round(Number(el.value)||1)):el.value;if(f==='type')d.unit=units[d.type][0][0]}setDay(selected,a)})
}
