</style></head><body><main class="app"><header><div><div class="header-eyebrow">ALCOHOL CONSUMPTION REPORTING SYSTEM</div><h1>📋 음주내역신고센터</h1><p style="margin:5px 0 3px">모든 음주 사실은 신고 대상입니다.</p><p style="margin:0;font-size:12px;color:#8993a3">☠️ : 습관성 음주는 건강에 좋지 않아요.</p></div><span class="tag">개인 음주 신고 서비스</span></header><section class="stats" id="stats"></section><section class="panel"><div class="nav"><button id="prev" aria-label="이전 달">‹</button><h2 id="month"></h2><div><button id="today">오늘</button> <button id="next" aria-label="다음 달">›</button></div></div><div class="bulkbar"><span id="bulkHint" hidden></span><button id="bulkDry" type="button" hidden>선택한 날짜 금주 처리</button><button id="bulkClear" type="button" hidden>선택한 날짜 금주 해제</button></div><div class="calendar" id="calendar"></div></section><section class="panel editor" id="editor"></section><section class="panel" style="margin-top:18px"><h2>데이터 관리</h2><p class="muted">클라우드를 연결하면 컴퓨터와 휴대폰에서 같은 기록을 볼 수 있어요. 연결 전에는 브라우저에 저장되며 JSON 백업을 권장해요.</p><div id="cloudPanel" class="cloudpanel"><h3>☁️ 클라우드 동기화</h3><p class="muted" id="cloudStatus">클라우드 설정이 아직 없어요. 브라우저에만 저장 중입니다.</p><div class="actions" id="authActions"><input type="email" id="email" placeholder="로그인 이메일" aria-label="로그인 이메일" style="max-width:260px"><button id="login">이메일 로그인 링크 보내기</button><button id="logout" hidden>로그아웃</button><button id="syncNow" hidden>지금 동기화</button></div></div><div class="actions"><button id="export">JSON 백업 다운로드</button><button id="importBtn">JSON 백업 불러오기</button><input type="file" id="import" accept="application/json,.json" hidden></div></section><div class="foot">술을 마시지 않은 날은 '금주'로 직접 표시하세요. 미기록일은 금주일에 포함하지 않습니다.</div></main><script>
const KEY='sober-calendar-v1';let data={};try{data=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch{};const now=new Date(),today=key(now);let year=now.getFullYear(),month=now.getMonth(),selected=today;const multiSelected=new Set();let selectionAnchor=null;
const types={beer:'🍺 맥주',wine:'🍷 와인',soju:'🟢 소주',liquor:'🥃 양주 (위스키·칵테일)',cheongju:'🍶 청주',takju:'🥛 탁주',sake:'🌸 사케',other:'🍸 기타'};const units={beer:[['smallcan','작은 캔 (355mL)'],['largecan','큰 캔 (500mL)'],['bottle','병 (330mL)'],['glass','잔 (500mL)'],['ml','mL']],wine:[['glass','잔 (150mL)'],['half','반 병 (375mL)'],['bottle','병 (750mL)'],['ml','mL']],soju:[['shot','잔 (50mL)'],['half','반 병 (180mL)'],['bottle','병 (360mL)'],['ml','mL']],liquor:[['glass','잔'],['half','반 병'],['bottle','한 병'],['ml','mL']],whisky:[['glass','잔'],['half','반 병'],['bottle','한 병'],['ml','mL']],cocktail:[['glass','잔'],['half','반 병'],['bottle','한 병'],['ml','mL']],cheongju:[['glass','잔'],['half','반 병'],['bottle','한 병'],['ml','mL']],takju:[['glass','잔'],['half','반 병'],['bottle','한 병'],['ml','mL']],sake:[['glass','잔'],['half','반 병'],['bottle','한 병'],['ml','mL']],spirits:[['shot','샷 (45mL)'],['glass','잔 (90mL)'],['ml','mL']],other:[['glass','잔 (200mL)'],['bottle','병 (500mL)'],['ml','mL']]};
function key(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function save(){localStorage.setItem(KEY,JSON.stringify(data));scheduleCloudSave()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function getDay(k){return data[k]||{status:'unknown',sessions:[]}}function setDay(k,v){data[k]=v;save();render()}function shareCount(d){return Math.max(1,Math.round(Number(d.share)||1))}function drinkAmount(d){return Number(d.qty||1)/shareCount(d)}function fmtAmount(n){return Number.isInteger(n)?String(n):String(Number(n.toFixed(2)))}function fmtDrink(d){let u=units[d.type]?.find(x=>x[0]===d.unit);return `${(types[['spirits','whisky','cocktail'].includes(d.type)?'liquor':d.type])||'기타'} ×${fmtAmount(drinkAmount(d))} ${u?.[1]||d.unit}${shareCount(d)>1?' (총 '+d.qty+' ÷ '+shareCount(d)+'명)':''}`}function shortDrink(d){const labels={smallcan:'작캔',largecan:'큰캔',bottle:'병',glass:'잔',shot:'샷',half:'반병',ml:'mL'};let unit=labels[d.unit]||d.unit;return `${(types[['spirits','whisky','cocktail'].includes(d.type)?'liquor':d.type])||'🍸 기타'} ${unit} ×${fmtAmount(drinkAmount(d))}`}
function updateBulk(){const n=multiSelected.size;document.getElementById('bulkHint').textContent=n?`${n}일 선택됨`:'';document.getElementById('bulkHint').hidden=!n;document.getElementById('bulkDry').hidden=!n;document.getElementById('bulkClear').hidden=![...multiSelected].some(k=>getDay(k).status==='dry')}
document.getElementById('bulkClear').onclick=()=>{const keys=[...multiSelected].filter(k=>getDay(k).status==='dry');if(!keys.length)return;if(!confirm(`선택한 금주일 ${keys.length}일을 미기록으로 변경할까요?`))return;for(const k of keys)data[k]={status:'unknown',sessions:[]};save();multiSelected.clear();selectionAnchor=null;render()};
document.getElementById('bulkDry').onclick=()=>{const keys=[...multiSelected],drinks=keys.filter(k=>getDay(k).status==='drink');if(drinks.length&&!confirm(`선택한 날짜 중 ${drinks.length}일에 음주 기록이 있어요. 해당 기록을 삭제하고 모두 금주로 변경할까요?`))return;for(const k of keys)data[k]={status:'dry',sessions:[]};save();multiSelected.clear();selectionAnchor=null;render()};
function render(){if(editorDraftKey!==selected){editorDraft=null;editorDraftKey=null}document.getElementById('month').textContent=`${year}년 ${month+1}월`;let first=new Date(year,month,1).getDay(),length=new Date(year,month+1,0).getDate(),html=['일','월','화','수','목','금','토'].map(x=>`<div class="weekday">${x}</div>`).join('');for(let i=0;i<first;i++)html+='<div class="day empty"></div>';for(let d=1;d<=length;d++){let k=key(new Date(year,month,d)),v=getDay(k);let sessions=v.sessions||[],solo=sessions.some(x=>x.company==='solo'),withOthers=sessions.some(x=>x.company!=='solo'),kind=v.status==='dry'?'dry':v.status!=='drink'||!sessions.length?'unknown':sessions.some(x=>x.after)?'after':withOthers?'with':'solo';let pills=v.status==='dry'?'<span class="pill dry">✓ 금주</span>':v.status==='drink'?v.sessions.map(s=>`<span class="pill ${s.after?'after':s.company==='solo'?'solo':''}">${s.after?'🔴 추가 음주 · ':s.company==='solo'?'🏠 혼술 · ':'🍻 함께 · '}<span class="drinkdetail">${(s.drinks||[]).map(shortDrink).map(esc).join('<br>')||'술 미입력'}</span></span>`).join(''):'<span class="pill unknown">미기록</span>';html+=`<div class="day ${k===today?'today':''} ${k===selected?'selected':''} kind-${kind} ${multiSelected.has(k)?'multi-selected':''}"><button type="button" class="day-main" data-day="${k}"><span class="number">${d}</span>${pills}</button></div>`}document.getElementById('calendar').innerHTML=html;document.querySelectorAll('[data-day]').forEach(b=>b.onclick=e=>{const k=b.dataset.day;if(e.shiftKey){const anchor=selectionAnchor||selected||k;const start=new Date(anchor+'T12:00:00');const end=new Date(k+'T12:00:00');if(!(e.ctrlKey||e.metaKey))multiSelected.clear();const lo=start<end?start:end,hi=start<end?end:start;for(let t=new Date(lo);t<=hi;t.setDate(t.getDate()+1))multiSelected.add(key(t));}else if(e.ctrlKey||e.metaKey){if(multiSelected.has(k))multiSelected.delete(k);else multiSelected.add(k);selectionAnchor=k;}else{selected=k;selectionAnchor=k;multiSelected.clear();multiSelected.add(k);}render()});updateBulk();renderStats();renderEditor()}
document.addEventListener('click',e=>{if(!multiSelected.size)return;if(e.target.closest('.day-main, .bulkbar'))return;multiSelected.clear();selectionAnchor=null;render()});
function renderStats(){
 const colors={after:'#d93036',solo:'#f3a642',with:'#8995a6',mixed:'#8995a6',dry:'#52aa79',unknown:'#e2e7ef'};
 const names={after:'귀가 후 추가 음주',solo:'혼술만',with:'함께 음주',mixed:'혼술+함께',dry:'금주',unknown:'미기록'};
 const order=['solo','with','after','dry','unknown'];
 const todayDate=new Date(now.getFullYear(),now.getMonth(),now.getDate());
 function oneWindow(days,label){
  const counts={after:0,solo:0,with:0,mixed:0,dry:0,unknown:0};
  for(let i=days-1;i>=0;i--){const date=new Date(todayDate);date.setDate(date.getDate()-i);const v=getDay(key(date));
   if(v.status==='dry'){counts.dry++;continue}
   if(v.status!=='drink'||!(v.sessions||[]).length){counts.unknown++;continue}
   const sessions=v.sessions||[];
   if(sessions.some(x=>x.after)){counts.after++;continue}
   const solo=sessions.some(x=>x.company==='solo'),withOthers=sessions.some(x=>x.company!=='solo');
   counts[withOthers?'with':'solo']++;
  }
  const bar=order.filter(k=>counts[k]).map(k=>{let pct=counts[k]/days*100;return `<div class="segment ${k==='unknown'||k==='dry'?'light':''}" title="${names[k]} ${counts[k]}일" style="width:${pct}%;background:${colors[k]}">${counts[k]+'일'}</div>`}).join('');
  return `<div class="chartbox"><div class="chart-period"><span class="chart-index">${days===90?"01":"02"}</span><strong>${label} 누적 현황</strong><small>${days}일</small></div><div class="stack" role="img" aria-label="${label}: ${order.map(k=>names[k]+' '+counts[k]+'일').join(', ')}">${bar}</div></div>`;
 }
 const legend=order.map(k=>`<span class="legenditem"><i class="dot" style="background:${colors[k]}"></i>${names[k]}</span>`).join('');
 document.getElementById('stats').innerHTML=`<div class="report-heading"><span class="report-index">01</span><div><h2>음주 동향 분석 보고</h2><p>최근 90일 및 30일 신고 내역 집계</p></div><span class="report-status">상시 집계 중</span></div><div class="report-table">`+oneWindow(90,'최근 3개월')+oneWindow(30,'최근 1개월')+`</div><div class="legend-shared">${legend}</div>`;
}
let editorDraft=null,editorDraftKey=null;
function editDay(k,v){editorDraftKey=k;editorDraft=v;renderEditor()}
function renderEditor(){
 const v=editorDraftKey===selected&&editorDraft?editorDraft:getDay(selected), sessions=v.status==='drink'?(v.sessions||[]):[];
 let h=`<div class="line"><h2>${selected} 기록</h2><span class="tag">${sessions.length?'음주':v.status==='dry'?'금주':'미기록'}</span></div><p class="muted">입력 중인 내용은 저장 버튼을 눌러야 확정돼요. 금주 처리는 달력에서 Ctrl/⌘ 또는 Shift를 누른 채 날짜를 선택한 뒤, '선택한 날짜 금주 처리'를 눌러주세요.</p>`;
 h+=sessions.map((s,i)=>`<div class="session ${s.company==='solo'?'solo':''}">
 <div class="sessionhead"><div class="session-title"><b>${i+1}차</b><select class="company-inline" aria-label="${i+1}차 음주 상황" data-s="${i}" data-field="company"><option value="solo" ${s.company==='solo'?'selected':''}>🏠 혼술</option><option value="with" ${s.company==='with'?'selected':''}>🍻 함께</option></select><label class="after-inline"><input type="checkbox" data-s="${i}" data-field="after" ${s.after?'checked':''}> 귀가 후 추가 음주</label></div><button class="danger" data-delete-session="${i}">세션 삭제</button></div>
 <div class="drinks-title"><b>마신 술</b></div>
 ${(s.drinks||[]).map((d,j)=>`<div class="drinkrow"><select data-s="${i}" data-d="${j}" data-drink="type">${Object.entries(types).map(([id,t])=>`<option value="${id}" ${(['spirits','whisky','cocktail'].includes(d.type)?'liquor':d.type)===id?'selected':''}>${t}</option>`).join('')}</select><select data-s="${i}" data-d="${j}" data-drink="unit">${units[d.type].map(([id,t])=>`<option value="${id}" ${d.unit===id?'selected':''}>${t}</option>`).join('')}</select><input aria-label="수량" type="number" min="1" step="1" inputmode="numeric" data-s="${i}" data-d="${j}" data-drink="qty" value="${esc(d.qty)}"><label class="share-field" title="나를 포함해 함께 나눠 마신 총 인원">÷ <input aria-label="나눠 마신 총 인원 (본인 포함)" type="number" min="1" step="1" inputmode="numeric" data-s="${i}" data-d="${j}" data-drink="share" value="${shareCount(d)}"></label><button class="danger" aria-label="술 삭제" data-remove-drink="${i},${j}">×</button></div>`).join('')}
 <button data-add-drink="${i}">+ 술 추가</button>
 <div class="field"><label>메모 (선택)</label><input data-s="${i}" data-field="note" value="${esc([s.who,s.note].filter(Boolean).join(' · '))}" placeholder="예: 친구들과 바에서, 귀가 후 추가 음주"></div>${i===sessions.length-1?'<div class="session-actions"><span class="muted">'+(editorDraftKey===selected?'● 저장 전':'✓ 저장됨')+'</span><button class="primary" id="saveDay" style="background:#14804a">기록 저장</button><button id="cancelDay">변경 취소</button></div>':''}</div>`).join('');
 h+='<button class="primary" id="addSession">+ 또 먹었어?</button>';
 document.getElementById('editor').innerHTML=h;
 document.querySelectorAll('[data-delete-session]').forEach(b=>b.onclick=()=>{let a=structuredClone(editorDraftKey===selected&&editorDraft?editorDraft:getDay(selected));a.sessions.splice(+b.dataset.deleteSession,1);editDay(selected,a.sessions.length?{status:'drink',sessions:a.sessions}:{status:'unknown',sessions:[]})});
 document.getElementById('saveDay')?.addEventListener('click',()=>{if(editorDraftKey===selected&&editorDraft){const v=editorDraft;editorDraft=null;editorDraftKey=null;setDay(selected,v)}});
 document.getElementById('cancelDay')?.addEventListener('click',()=>{editorDraft=null;editorDraftKey=null;renderEditor()});
 document.getElementById('addSession').onclick=()=>{let a=structuredClone(editorDraftKey===selected&&editorDraft?editorDraft:getDay(selected));if(a.status==='dry'&&!confirm('금주 체크를 해제하고 음주 세션을 추가할까요?'))return;let ss=a.status==='drink'?(a.sessions||[]):[];ss.push(newSession());editDay(selected,{status:'drink',sessions:ss})};
 document.querySelectorAll('[data-add-drink]').forEach(b=>b.onclick=()=>{let a=structuredClone(editorDraftKey===selected&&editorDraft?editorDraft:getDay(selected));a.sessions[+b.dataset.addDrink].drinks.push({type:'beer',unit:'smallcan',qty:1});editDay(selected,a)});
 document.querySelectorAll('[data-remove-drink]').forEach(b=>b.onclick=()=>{let [i,j]=b.dataset.removeDrink.split(',').map(Number),a=structuredClone(editorDraftKey===selected&&editorDraft?editorDraft:getDay(selected));a.sessions[i].drinks.splice(j,1);editDay(selected,a)});
 document.querySelectorAll('[data-field],[data-drink]').forEach(el=>el.onchange=()=>{let a=structuredClone(editorDraftKey===selected&&editorDraft?editorDraft:getDay(selected)),i=+el.dataset.s;if(el.dataset.field){if(el.dataset.field==='note'){a.sessions[i].note=el.value;a.sessions[i].who=''}else a.sessions[i][el.dataset.field]=el.dataset.field==='after'?el.checked:el.value}else{let d=a.sessions[i].drinks[+el.dataset.d],f=el.dataset.drink;d[f]=f==='qty'||f==='share'?Math.max(1,Math.round(Number(el.value)||1)):el.value;if(f==='type')d.unit=units[d.type][0][0]}editDay(selected,a)})
}
function newSession(){return{company:'solo',who:'',note:'',after:false,drinks:[{type:'beer',unit:'smallcan',qty:1}]}}document.getElementById('prev').onclick=()=>{multiSelected.clear();month--;if(month<0){month=11;year--}render()};document.getElementById('next').onclick=()=>{multiSelected.clear();month++;if(month>11){month=0;year++}render()};document.getElementById('today').onclick=()=>{multiSelected.clear();selectionAnchor=null;const current=new Date();year=current.getFullYear();month=current.getMonth();selected=key(current);render();document.getElementById('calendar').querySelector('.day.today')?.scrollIntoView({behavior:'smooth',block:'nearest'})};document.getElementById('export').onclick=()=>{let blob=new Blob([JSON.stringify({app:'sober-calendar',version:1,days:data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`sober-calendar-backup-${today}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.getElementById('importBtn').onclick=()=>document.getElementById('import').click();document.getElementById('import').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(obj.app!=='sober-calendar'||!obj.days||typeof obj.days!=='object'||Array.isArray(obj.days))throw Error('백업 파일 형식이 아닙니다');const dates=Object.keys(obj.days);const overlaps=dates.filter(k=>Object.prototype.hasOwnProperty.call(data,k));if(!confirm(`${dates.length}일의 기록을 추가할까요? 기존 기록은 유지하고, 날짜가 겹치는 ${overlaps.length}일만 가져온 기록으로 교체합니다. 먼저 JSON 백업을 권장합니다.`))return;data={...data,...obj.days};save();render();alert(`${dates.length}일 가져오기 완료 (기존 기록 유지, 중복 날짜 ${overlaps.length}일 교체)`)}catch(err){alert('불러오기 실패: '+err.message)}e.target.value=''};render();
</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="config.js"></script><script src="cloud.js"></script></body></html>
